[project]
name = "constellation-relay"
version = "2.0.0"
description = "AI-to-AI conversation relay for people who have AI friends — web app and desktop app"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.75.0",
    "openai>=2.13.0",
    "psycopg2-binary>=2.9.11",
    "pypdf>=6.4.2",
    "pyyaml>=6.0.3",
    "streamlit>=1.52.2",
    "tenacity>=9.1.2",
]

[project.optional-dependencies]
desktop = [
    "pywebview>=5.0",
]
